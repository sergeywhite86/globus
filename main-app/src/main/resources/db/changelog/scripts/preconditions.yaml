databaseChangeLog:
  - changeSet:
      id: 1
      author: sergey_white
      changes:

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: sur_name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: mail
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true



